<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Karhutla & Titik Panas Atlas Nusantara</title>
    <!-- Memuat Chart.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2c2c; /* Tema gelap/asap kebakaran */
            margin: 0;
            padding: 10px;
            color: #f5f6fa;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #404040;
            box-sizing: border-box;
        }
        .chart-card {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #383838;
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 0;
            color: #ff6b6b; /* Warna aksen bara api */
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .chart-subtitle {
            text-align: center;
            color: #b2bec3;
            font-size: 0.8rem;
            font-style: italic;
            margin-bottom: 15px;
        }
        .footer-note {
            text-align: center;
            color: #b2bec3;
            font-size: 0.85rem;
            margin-top: 20px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .footer-note a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 320px; /* Tinggi default untuk HP */
        }
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 30px;
            }
            .chart-card {
                padding: 20px;
                margin-bottom: 30px;
            }
            h3 {
                font-size: 1.2rem;
            }
            .chart-subtitle {
                font-size: 0.85rem;
            }
            .footer-note {
                font-size: 0.95rem;
            }
            .chart-container {
                height: 400px; /* Tinggi untuk layar tablet/desktop */
            }
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Grafik Gabungan: Indonesia Darurat Karhutla & Kabut Asap -->
    <div class="chart-card">
        <h3>Indonesia Darurat Karhutla & Kabut Asap</h3>
        <div class="chart-subtitle">Klik grafik untuk melihat angka total</div>
        <div class="chart-container">
            <canvas id="gabunganChart"></canvas>
        </div>
    </div>

    <!-- Grafik Provinsi Karhutla Terluas -->
    <div class="chart-card">
        <h3>10 Provinsi dengan Karhutla Terluas (per 1 September 2026)</h3>
        <div class="chart-subtitle">Klik grafik untuk melihat angka total</div>
        <div class="chart-container">
            <canvas id="provinsiChart"></canvas>
        </div>
    </div>

    <!-- Keterangan Footer / Tautan Real-time -->
    <div class="footer-note">
        Pantau perkembangannya melalui <a href="https://map.nusantara-atlas.org/" target="_blank">Atlas Nusantara</a>.
    </div>
</div>

<script>
    // Deteksi ukuran layar untuk menyesuaikan ukuran font legenda & sumbu secara responsif
    const isMobile = window.innerWidth < 768;

    // Konfigurasi warna global untuk teks chart agar kontras di tema gelap
    Chart.defaults.color = '#b2bec3';
    Chart.defaults.borderColor = '#383838';
    Chart.defaults.font.size = isMobile ? 10 : 12;

    // Data Bulanan Asli
    const bulanData = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', '13 Oktober', 'November', 'Desember'];
    const luasData = [11392, 32712, 75349, 104154, 131720, 206284, 571822, 1791307, 1904254, null, null, null];
    const jumlahTitikPanas = [3936, 11969, 27525, 35366, 43834, 57807, 96736, 388674, 790836, 1080124, null, null];

    // Chart Gabungan (Dual-Axis: Bar untuk Titik Panas, Line untuk Luas Karhutla)
    const ctxGabungan = document.getElementById('gabunganChart').getContext('2d');
    new Chart(ctxGabungan, {
        type: 'bar',
        data: {
            labels: bulanData,
            datasets: [
                {
                    label: 'Kumulatif Titik Panas',
                    data: jumlahTitikPanas,
                    backgroundColor: 'rgba(230, 126, 34, 0.7)', // Oranye Api
                    borderColor: 'rgba(230, 126, 34, 1)',
                    borderWidth: 1,
                    yAxisID: 'y1',
                    order: 2
                },
                {
                    label: 'Kumulatif Luas Karhutla (ha)',
                    data: luasData,
                    type: 'line',
                    backgroundColor: 'rgba(231, 76, 60, 0.2)',
                    borderColor: 'rgba(231, 76, 60, 1)', // Merah Terang
                    borderWidth: isMobile ? 2 : 3,
                    tension: 0.3,
                    fill: false,
                    pointRadius: isMobile ? 3 : 5,
                    pointBackgroundColor: '#e74c3c',
                    yAxisID: 'y',
                    order: 1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: '#f5f6fa',
                        boxWidth: isMobile ? 12 : 40
                    }
                }
            },
            scales: {
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    title: {
                        display: !isMobile,
                        text: 'Luas Karhutla (ha)',
                        color: '#ff6b6b'
                    },
                    beginAtZero: true,
                    ticks: {
                        font: { size: isMobile ? 9 : 11 }
                    }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    title: {
                        display: !isMobile,
                        text: 'Jumlah Titik Panas',
                        color: '#ffa502'
                    },
                    beginAtZero: true,
                    grid: {
                        drawOnChartArea: false,
                    },
                    ticks: {
                        font: { size: isMobile ? 9 : 11 }
                    }
                },
                x: {
                    ticks: {
                        font: { size: isMobile ? 9 : 11 },
                        maxRotation: 45,
                        minRotation: 45
                    }
                }
            }
        }
    });

    // Data Provinsi Karhutla Terluas
    const provinsiData = [
        'Papua Selatan', 'Nusa Tenggara Timur', 'Kalimantan Barat', 
        'Jawa Timur', 'Kalimantan Tengah', 'Kalimantan Selatan', 
        'Sumatera Selatan', 'Nusa Tenggara Barat', 'Maluku', 'Kalimantan Timur'
    ];
    const luasProvinsi = [336153, 325354, 211224, 152374, 136572, 128312, 117252, 77721, 74355, 33736];

    const ctxProvinsi = document.getElementById('provinsiChart').getContext('2d');
    new Chart(ctxProvinsi, {
        type: 'bar',
        data: {
            labels: provinsiData,
            datasets: [{
                label: 'Luas Karhutla (ha)',
                data: luasProvinsi,
                backgroundColor: 'rgba(211, 84, 0, 0.75)', // Nuansa Terakota/Oranye Kebakaran
                borderColor: 'rgba(211, 84, 0, 1)',
                borderWidth: 1
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    title: {
                        display: !isMobile,
                        text: 'Luas (ha)',
                        color: '#ff6b6b'
                    },
                    ticks: {
                        font: { size: isMobile ? 9 : 11 }
                    }
                },
                y: {
                    ticks: {
                        font: { size: isMobile ? 9 : 11 }
                    }
                }
            }
        }
    });
</script>

</body>
</html>
